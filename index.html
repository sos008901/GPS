<script>
  // Initial Sample Coordinates (Le Mans circuit coordinates)
  const SAMPLE_COORDS = `47.997699, 0.198029
47.997589, 0.199023
47.997305, 0.200037
47.997233, 0.201194
47.998614, 0.200226
47.999667, 0.200370
47.999959, 0.199168
48.001267, 0.197840
48.000088, 0.196423
47.999551, 0.196546
47.999274, 0.198367
47.998801, 0.198730`;

  // Application State
  let currentExportType = 'trk'; // 'trk' | 'wpt'
  let parsedPoints = [];
  let map, polylineLayer, markersLayer;

  // Initialize Lucide Icons
  lucide.createIcons();

  // Initialize Leaflet Map
  function initMap() {
    map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView([23.973875, 120.982024], 7); // Default centered in Taiwan

    // Add Dark Mode OSM Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      className: 'dark-map-tiles'
    }).addTo(map);

    polylineLayer = L.polyline([], {
      color: '#6366f1',
      weight: 4,
      opacity: 0.9,
      lineJoin: 'round'
    }).addTo(map);

    markersLayer = L.layerGroup().addTo(map);
  }

  // Calculate distance between two lat/lon using Haversine formula (km)
  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Earth radius in km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
      Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // Parse Raw Coordinate Text
  function parseCoordinateText(text) {
    if (!text || !text.trim()) return [];
    const lines = text.trim().split(/\r?\n/);
    const points = [];

    for (let line of lines) {
      const clean = line.trim().replace(/[\(\)\[\]]/g, '');
      if (!clean) continue;

      // Match Google Maps URL pattern if any
      const gmapMatch = clean.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (gmapMatch) {
        points.push({ lat: parseFloat(gmapMatch[1]), lon: parseFloat(gmapMatch[2]) });
        continue;
      }

      // Split by comma, tab, or space
      const parts = clean.split(/[,;\s\t]+/).filter(Boolean);
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]);
        const lon = parseFloat(parts[1]);
        const ele = parts[2] !== undefined ? parseFloat(parts[2]) : undefined;

        if (!isNaN(lat) && !isNaN(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
          points.push({
            lat: lat,
            lon: lon,
            ele: !isNaN(ele) ? ele : undefined
          });
        }
      }
    }
    return points;
  }

  // Update Map Graphics & Markers
  function updateMap(points) {
    if (!map) return;
    markersLayer.clearLayers();

    if (points.length === 0) {
      polylineLayer.setLatLngs([]);
      return;
    }

    const latlngs = points.map(p => [p.lat, p.lon]);
    polylineLayer.setLatLngs(latlngs);

    // Custom Icon Generator
    const createMarkerIcon = (color, label) => L.divIcon({
      className: 'custom-div-icon',
      html: `<div class="w-6 h-6 rounded-full ${color} border-2 border-white shadow-lg flex items-center justify-center text-[10px] font-bold text-white">${label}</div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    // Start Marker
    L.marker(latlngs[0], { icon: createMarkerIcon('bg-emerald-500', '起') })
      .bindPopup(`<b>起點</b><br>${points[0].lat.toFixed(6)}, ${points[0].lon.toFixed(6)}`)
      .addTo(markersLayer);

    // End Marker (if > 1 point)
    if (points.length > 1) {
      L.marker(latlngs[latlngs.length - 1], { icon: createMarkerIcon('bg-red-500', '終') })
        .bindPopup(`<b>終點</b><br>${points[points.length - 1].lat.toFixed(6)}, ${points[points.length - 1].lon.toFixed(6)}`)
        .addTo(markersLayer);
    }

    // Waypoint Mode: Add small dots for intermediate points
    if (currentExportType === 'wpt' && points.length > 2) {
      for (let i = 1; i < points.length - 1; i++) {
        L.circleMarker(latlngs[i], {
          radius: 4,
          color: '#818cf8',
          fillColor: '#4f46e5',
          fillOpacity: 0.9,
          weight: 1.5
        }).addTo(markersLayer);
      }
    }

    // Fit map bounds
    try {
      const bounds = L.latLngBounds(latlngs);
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
    } catch (e) {
      console.warn("Bounds fit error:", e);
    }
  }

  // Update Dashboard Statistics
  function updateStats(points) {
    document.getElementById('statPoints').textContent = points.length;

    if (points.length === 0) {
      document.getElementById('statDistance').textContent = '0.00 km';
      document.getElementById('statTime').textContent = '--:--';
      document.getElementById('statStart').textContent = '尚未設定';
      document.getElementById('statEnd').textContent = '尚未設定';
      return;
    }

    // Calculate total distance
    let totalKm = 0;
    for (let i = 0; i < points.length - 1; i++) {
      totalKm += calculateDistance(points[i].lat, points[i].lon, points[i+1].lat, points[i+1].lon);
    }

    document.getElementById('statDistance').textContent = totalKm < 1 
      ? `${(totalKm * 1000).toFixed(0)} m` 
      : `${totalKm.toFixed(2)} km`;

    // Calculate Estimated Time based on Speed Selection
    const speedSetting = document.getElementById('speedMode').value;
    let speedKmh = 5;
    if (speedSetting === 'run_10') speedKmh = 10;
    else if (speedSetting === 'bike_20') speedKmh = 20;
    else if (speedSetting === 'car_60') speedKmh = 60;
    
    if (speedSetting === 'none') {
      document.getElementById('statTime').textContent = '無時間';
    } else if (speedSetting === 'fixed_10s') {
      const totalSec = points.length * 10;
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      document.getElementById('statTime').textContent = `${mins}分 ${secs}秒`;
    } else {
      const totalHours = totalKm / speedKmh;
      const totalMinutes = Math.round(totalHours * 60);
      const hrs = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      document.getElementById('statTime').textContent = hrs > 0 ? `${hrs}小時 ${mins}分` : `${mins} 分鐘`;
    }

    document.getElementById('statStart').textContent = `${points[0].lat.toFixed(4)}, ${points[0].lon.toFixed(4)}`;
    document.getElementById('statEnd').textContent = `${points[points.length - 1].lat.toFixed(4)}, ${points[points.length - 1].lon.toFixed(4)}`;
  }

  // Handle Full Data Refresh
  function handleDataChange() {
    const rawText = document.getElementById('coordInput').value;
    parsedPoints = parseCoordinateText(rawText);
    updateStats(parsedPoints);
    updateMap(parsedPoints);
  }

  // Generate Standard GPX XML String
  function generateGPXXML() {
    if (parsedPoints.length === 0) return null;
    const rawName = document.getElementById('routeName').value.trim() || '我的路線';
    const name = rawName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const speedSetting = document.getElementById('speedMode').value;
    
    let startTime = new Date();
    let currentPointTime = new Date(startTime.getTime());

    // Speed calculation in meters per second
    let speedKmh = 5;
    if (speedSetting === 'run_10') speedKmh = 10;
    else if (speedSetting === 'bike_20') speedKmh = 20;
    else if (speedSetting === 'car_60') speedKmh = 60;
    const speedMps = (speedKmh * 1000) / 3600;

    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += '<gpx version="1.1" creator="GPXGeneratorWebApp" xmlns="http://www.topografix.com/GPX/1/1">\n';
    xml += '  <metadata>\n';
    xml += `    <name>${name}</name>\n`;
    xml += `    <time>${startTime.toISOString()}</time>\n`;
    xml += '  </metadata>\n';

    if (currentExportType === 'wpt') {
      parsedPoints.forEach((pt, i) => {
        xml += `  <wpt lat="${pt.lat}" lon="${pt.lon}">\n`;
        if (pt.ele !== undefined) xml += `    <ele>${pt.ele}</ele>\n`;
        xml += `    <name>點位 ${i + 1}</name>\n`;
        if (speedSetting !== 'none') {
          xml += `    <time>${currentPointTime.toISOString()}</time>\n`;
          currentPointTime = new Date(currentPointTime.getTime() + 10000);
        }
        xml += '  </wpt>\n';
      });
    } else {
      xml += '  <trk>\n';
      xml += `    <name>${name}</name>\n`;
      xml += '    <trkseg>\n';
      
      parsedPoints.forEach((pt, i) => {
        if (i > 0 && speedSetting !== 'none') {
          if (speedSetting === 'fixed_10s') {
            currentPointTime = new Date(currentPointTime.getTime() + 10000);
          } else {
            const distKm = calculateDistance(parsedPoints[i-1].lat, parsedPoints[i-1].lon, pt.lat, pt.lon);
            const durationSec = Math.max(1, Math.round((distKm * 1000) / speedMps));
            currentPointTime = new Date(currentPointTime.getTime() + durationSec * 1000);
          }
        }

        xml += `      <trkpt lat="${pt.lat}" lon="${pt.lon}">\n`;
        if (pt.ele !== undefined) xml += `        <ele>${pt.ele}</ele>\n`;
        if (speedSetting !== 'none') xml += `        <time>${currentPointTime.toISOString()}</time>\n`;
        xml += '      </trkpt>\n';
      });

      xml += '    </trkseg>\n';
      xml += '  </trk>\n';
    }
    xml += '</gpx>';
    return xml;
  }

  // Toast Notification
  function showToast(msg, icon = 'check-circle') {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    toastMsg.textContent = msg;
    toastIcon.setAttribute('data-lucide', icon);
    lucide.createIcons();

    toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
    toast.classList.add('opacity-100', 'translate-y-0');

    setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
    }, 2800);
  }

  // Document Ready & Event Bindings
  window.addEventListener('DOMContentLoaded', () => {
    initMap();

    const coordInput = document.getElementById('coordInput');
    const btnLoadSample = document.getElementById('btnLoadSample');
    const btnClear = document.getElementById('btnClear');
    const btnSwapCoords = document.getElementById('btnSwapCoords');
    const btnPaste = document.getElementById('btnPaste');
    const btnDownload = document.getElementById('btnDownload');
    const btnShare = document.getElementById('btnShare');
    const btnCopyXML = document.getElementById('btnCopyXML');
    const btnFitMap = document.getElementById('btnFitMap');
    const typeTrk = document.getElementById('typeTrk');
    const typeWpt = document.getElementById('typeWpt');
    const speedMode = document.getElementById('speedMode');

    // Real-time Text Input Listener
    coordInput.addEventListener('input', handleDataChange);
    speedMode.addEventListener('change', () => updateStats(parsedPoints));

    // Load Sample Button
    btnLoadSample.addEventListener('click', () => {
      coordInput.value = SAMPLE_COORDS;
      document.getElementById('routeName').value = '利曼賽道經典範例';
      handleDataChange();
      showToast('已成功載入範例座標！', 'sparkles');
    });

    // Clear Button
    btnClear.addEventListener('click', () => {
      coordInput.value = '';
      handleDataChange();
      showToast('已清空所有座標。', 'trash-2');
    });

    // Swap Lat / Lon (經緯度對調)
    btnSwapCoords.addEventListener('click', () => {
      if (parsedPoints.length === 0) {
        showToast('請先輸入座標才能進行對調。', 'alert-circle');
        return;
      }
      const swappedLines = parsedPoints.map(p => {
        return p.ele !== undefined ? `${p.lon}, ${p.lat}, ${p.ele}` : `${p.lon}, ${p.lat}`;
      });
      coordInput.value = swappedLines.join('\n');
      handleDataChange();
      showToast('經緯度已全部對調！', 'arrow-left-right');
    });

    // Paste from Clipboard
    btnPaste.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            coordInput.value = text;
            handleDataChange();
            showToast('已貼上剪貼簿內容！', 'clipboard');
            return;
          }
        }
        // Fallback for restrictions
        coordInput.focus();
        showToast('請直接在文字框中長按貼上。', 'info');
      } catch (err) {
        coordInput.focus();
        showToast('瀏覽器權限限制，請手動貼上。', 'info');
      }
    });

    // Toggle Mode: Track vs Waypoints
    typeTrk.addEventListener('click', () => {
      currentExportType = 'trk';
      typeTrk.className = 'py-2 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5 bg-brand-600 text-white shadow';
      typeWpt.className = 'py-2 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5 text-slate-400 hover:text-white';
      updateMap(parsedPoints);
    });

    typeWpt.addEventListener('click', () => {
      currentExportType = 'wpt';
      typeWpt.className = 'py-2 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5 bg-brand-600 text-white shadow';
      typeTrk.className = 'py-2 text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5 text-slate-400 hover:text-white';
      updateMap(parsedPoints);
    });

    // Download GPX File
    btnDownload.addEventListener('click', () => {
      const xml = generateGPXXML();
      if (!xml) {
        showToast('請先輸入至少一組有效座標！', 'alert-circle');
        return;
      }
      const rawName = document.getElementById('routeName').value.trim() || 'route';
      const cleanFileName = rawName.replace(/[^a-zA-Z0-9_\u4e00-\u9fa5-]/g, '_');
      
      const blob = new Blob([xml], { type: 'application/gpx+xml;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${cleanFileName}.gpx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`已成功下載 ${cleanFileName}.gpx`, 'download');
    });

    // Web Share API (Directly send to Garmin / LINE / Hikingbook on Mobile)
    btnShare.addEventListener('click', async () => {
      const xml = generateGPXXML();
      if (!xml) {
        showToast('請先輸入座標才能分享！', 'alert-circle');
        return;
      }
      const rawName = document.getElementById('routeName').value.trim() || 'route';
      const cleanFileName = rawName.replace(/[^a-zA-Z0-9_\u4e00-\u9fa5-]/g, '_');
      const blob = new Blob([xml], { type: 'application/gpx+xml;charset=utf-8;' });
      const file = new File([blob], `${cleanFileName}.gpx`, { type: 'application/gpx+xml' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: `${rawName}.gpx`,
            text: `這是為您生成的 GPX 軌跡檔：${rawName}`
          });
          showToast('分享成功！', 'share-2');
        } catch (err) {
          if (err.name !== 'AbortError') {
            showToast('分享取消或失敗。', 'alert-circle');
          }
        }
      } else {
        // Fallback: Download file directly
        btnDownload.click();
        showToast('此瀏覽器未支援直接傳送檔案，已自動為您下載！', 'download');
      }
    });

    // Copy XML to Clipboard
    btnCopyXML.addEventListener('click', () => {
      const xml = generateGPXXML();
      if (!xml) {
        showToast('請先輸入有效座標！', 'alert-circle');
        return;
      }

      // Fallback copy strategy
      const tempArea = document.createElement('textarea');
      tempArea.value = xml;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast('GPX 原始碼已複製至剪貼簿！', 'code');
      } catch (err) {
        showToast('複製失敗，請手動複製。', 'alert-circle');
      }
      document.body.removeChild(tempArea);
    });

    // Fit Map Viewport
    btnFitMap.addEventListener('click', () => {
      if (parsedPoints.length > 0) {
        const latlngs = parsedPoints.map(p => [p.lat, p.lon]);
        map.fitBounds(L.latLngBounds(latlngs), { padding: [40, 40] });
        showToast('已重新對焦至路線全景。', 'maximize-2');
      }
    });

    // Load initial sample
    btnLoadSample.click();
  });
</script>
</body>
</html>
